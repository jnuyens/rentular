# ===========================================================================
# Rentular — nginx reverse-proxy server block (REFERENCE)
# ===========================================================================
# Installed on the m1 host by the operator in Plan 06:
#   sudo cp deploy/nginx/rentular.conf /etc/nginx/sites-available/rentular.conf
#   sudo ln -s /etc/nginx/sites-available/rentular.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is issued/renewed by the EXISTING Let's Encrypt automation already on m1
# for sibling domains (certbot). The cert paths below follow the standard
# certbot layout; the certbot --nginx plugin (or the existing renewal hook)
# manages these lines. Run certbot for rentular.com once the A record points
# at m1; `nginx -t` is the authoritative syntax check (deferred to the box).
#
# Routing (see 10-RESEARCH system diagram):
#   /            -> web:3000   (Next.js standalone SSR)
#   /api/v1      -> api:4000   (Hono, basePath /api/v1 — PREFIX PRESERVED)
#   /deploy-webhook -> 127.0.0.1:9000 (loopback webhook receiver; systemd)
#
# All upstreams are loopback-published by docker-compose.prod.yml
# (127.0.0.1:3000 / :4000). nginx is the SOLE public ingress.
# ===========================================================================

# --- HTTP -> HTTPS redirect -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name rentular.com www.rentular.com;

    # Allow ACME http-01 challenges to pass through (certbot webroot/nginx).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server -----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rentular.com www.rentular.com;

    # --- TLS (managed by existing Let's Encrypt / certbot automation) -------
    ssl_certificate     /etc/letsencrypt/live/rentular.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rentular.com/privkey.pem;
    # certbot ships these managed snippets; keep if present on the host:
    #   include /etc/letsencrypt/options-ssl-nginx.conf;
    #   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Reasonable upload ceiling (bank statements / imports).
    client_max_body_size 25m;

    # --- Shared proxy headers (Pitfall 7: NextAuth needs X-Forwarded-Proto) -
    # X-Forwarded-Proto https lets NextAuth v5 (trustHost: true) issue secure
    # cookies and correct callback URLs behind TLS termination.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;   # WebSocket upgrade
    proxy_set_header Connection $http_upgrade;

    # --- API: /api/v1 -> Hono api:4000, PREFIX PRESERVED --------------------
    # The Hono app is mounted at basePath /api/v1, so the upstream expects the
    # FULL /api/v1/... path. Do NOT add a trailing slash to proxy_pass (that
    # would strip the location prefix and break every route).
    location /api/v1 {
        proxy_pass http://127.0.0.1:4000;
    }

    # --- Deploy webhook: GitHub POSTs https://rentular.com/deploy-webhook ---
    # Proxied to the loopback webhook receiver (systemd, 127.0.0.1:9000). The
    # receiver HMAC-verifies X-Hub-Signature-256 before doing anything.
    location /deploy-webhook {
        proxy_pass http://127.0.0.1:9000;
    }

    # --- Web: everything else -> Next.js standalone web:3000 ----------------
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
